[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synth-hillclimb"
version = "0.1.0"
description = "Rust-first prompt, context, skill, and agent harness optimization engine CLI and SDK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "rich>=13,<15",
    "zstandard>=0.23,<1",
    "tqdm>=4.65,<5",
]

[project.optional-dependencies]
tui = [
    "pillow>=10.1,<13",
    "prompt-toolkit>=3,<4",
]
mcp = [
    "mcp>=1,<2",
]
all = [
    "synth-hillclimb[tui,mcp]",
]

[project.urls]
Homepage = "https://github.com/synth-laboratories/hillclimb"
Repository = "https://github.com/synth-laboratories/hillclimb"

[project.scripts]
hillclimb = "hillclimb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hillclimb"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "src/**/*.py" },
    { file = "src/**/*.cjs" },
]
